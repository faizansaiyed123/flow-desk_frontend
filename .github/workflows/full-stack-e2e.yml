name: Full-stack verification

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "e2e/**"
      - "docs/testing/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "vite.config.ts"
      - ".github/workflows/full-stack-e2e.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-stack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  full-stack:
    name: PostgreSQL + FastAPI + browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flowdesk_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flowdesk_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out frontend
        uses: actions/checkout@v4

      - name: Check out backend
        uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/flow-desk_backend
          ref: main
          path: backend

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Create isolated API-test database
        env:
          PGPASSWORD: postgres
        run: createdb -h 127.0.0.1 -U postgres flowdesk_test

      - name: Run backend API and PostgreSQL tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/flowdesk_test
          SECRET_KEY: ci-only-secret-key-not-for-production
          ENVIRONMENT: test
          DEBUG: "false"
          EMAIL_ENABLED: "false"
          CORS_ORIGINS: http://localhost:5173
          FRONTEND_URL: http://localhost:5173
        run: pytest -q

      - name: Apply migrations to the end-to-end database
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/flowdesk_e2e
          SECRET_KEY: ci-only-secret-key-not-for-production
          ENVIRONMENT: test
          DEBUG: "false"
        run: alembic upgrade head

      - name: Start FastAPI against PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/flowdesk_e2e
          SECRET_KEY: ci-only-secret-key-not-for-production
          ENVIRONMENT: test
          DEBUG: "false"
          EMAIL_ENABLED: "false"
          CORS_ORIGINS: http://localhost:5173
          FRONTEND_URL: http://localhost:5173
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check and build frontend
        run: npm run build

      - name: Run frontend unit tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium webkit

      - name: Run real full-stack browser tests
        env:
          CI: "true"
        run: npm run e2e

      - name: Verify walkthrough records directly in PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/flowdesk_e2e
        run: python ../e2e/verify-postgres-state.py

      - name: Upload test report, screenshots, and backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowdesk-full-stack-test-evidence
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
            docs/testing/visuals/
            ${{ runner.temp }}/backend.log

      - name: Commit verified walkthrough screenshots
        if: success() && github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        env:
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/generated-visuals"
          cp docs/testing/visuals/*.png "$RUNNER_TEMP/generated-visuals/"
          git fetch origin "$HEAD_REF"
          git checkout --force -B "$HEAD_REF" "origin/$HEAD_REF"
          mkdir -p docs/testing/visuals
          cp "$RUNNER_TEMP/generated-visuals"/*.png docs/testing/visuals/
          python - "$RUN_URL" <<'PY'
          from pathlib import Path
          import sys

          path = Path("docs/testing/VISUAL-TEST-WALKTHROUGH.md")
          if path.exists():
              text = path.read_text()
              text = text.replace("<!-- LATEST_FULL_STACK_RUN -->Pending first successful CI run.<!-- /LATEST_FULL_STACK_RUN -->",
                                  f"<!-- LATEST_FULL_STACK_RUN -->[All required checks passed]({sys.argv[1]}).<!-- /LATEST_FULL_STACK_RUN -->")
              path.write_text(text)
          PY
          git add docs/testing/visuals/*.png docs/testing/VISUAL-TEST-WALKTHROUGH.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "test: add verified full-stack walkthrough screenshots"
            git push origin "HEAD:$HEAD_REF"
          fi
