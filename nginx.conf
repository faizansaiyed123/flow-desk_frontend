server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxied to the backend container by service name in docker-compose.
    # In a non-Docker deployment, point this at the real API origin instead
    # (or serve the frontend from a different domain and set VITE-time API
    # base URL / rely on CORS — see README-DEPLOY.md).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any non-file, non-API route serves index.html so
    # client-side routing (react-router) handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
